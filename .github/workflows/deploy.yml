name: Deploy workflow

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest
        container: 
            image: node:20
        steps:
            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: 20
            - run: npm ci
            - run: npm run build
            - run: npm run deploy